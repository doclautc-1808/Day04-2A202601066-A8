tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại khi thiếu tài khoản/URL/chủ đề bằng response_type=text; trước mọi hành động gửi/đăng khi chưa xác nhận phải dùng response_type=yes_no."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi làm rõ ngắn gọn"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn nếu response_type=choice"}
      required: [question]

  - name: timeline
    description: "Lấy tweet mới nhất CỦA tài khoản đã được người dùng nêu. Nếu thiếu tài khoản phải gọi clarify, tuyệt đối không tự chọn screenname."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle tài khoản không có @"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm tweet theo CHỦ ĐỀ; dùng Top cho nội dung phổ biến và Latest cho nội dung mới."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề cần tìm"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tìm thông tin hoặc tin tức trên web. Không dùng cho arXiv, tweet, policy nội bộ hoặc khi đã có URL cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn web"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian, chỉ áp dụng khi topic=news"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc một URL cụ thể không thuộc arXiv. Với arXiv ID/abs/pdf URL phải dùng paper_text."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL cụ thể"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã thu thập; paper_scout tạo báo cáo paper kèm dẫn chứng PDF theo trang. Tool không tự tìm nguồn."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã thu thập và phân tích"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
              arxiv_id: {type: string}
              pdf_url: {type: string}
              authors: {type: array, items: {type: string}}
              problem: {type: string}
              method: {type: string}
              result: {type: string}
              limitation: {type: string}
              implementation_relevance: {type: string}
              evidence:
                type: array
                items:
                  type: object
                  properties:
                    page_number: {type: integer}
                    excerpt: {type: string}
                    pdf_url: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn, paper_scout], default: "sections", description: "Dùng paper_scout cho báo cáo nghiên cứu arXiv"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus / extension tools ----------------
  - name: send
    description: "Gửi nội dung ra Telegram. Chỉ gọi sau xác nhận rõ của người dùng và đặt confirmed=true."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [text]

  - name: policy
    description: "Tra cứu policy nội bộ của công ty; không thay thế web search hoặc arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn policy"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm policy"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm paper/preprint theo CHỦ ĐỀ trên arXiv qua Atom API công khai, không cần API key. Trả metadata và PDF URL."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề hoặc truy vấn arXiv"}
        max_results: {type: integer, default: 5, description: "Số lượng, tối đa 10"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Tải PDF từ arXiv ID/abs/pdf URL và trích text kèm số trang. Dùng focus_query để tìm dẫn chứng trong toàn paper."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc URL arxiv.org, ví dụ 1706.03762"}
        max_pages: {type: integer, default: 5, description: "Số trang đầu nếu không có focus_query; 1-50"}
        max_chars: {type: integer, default: 8000, description: "Tổng ký tự dẫn chứng; 1000-20000"}
        focus_query: {type: string, default: "", description: "Chủ đề hoặc claim cần tìm trong toàn PDF"}
        max_evidence: {type: integer, default: 5, description: "Số đoạn dẫn chứng; 1-10"}
      required: [arxiv_url]

  - name: paper_rank
    description: "Xếp hạng metadata paper đã có hoàn toàn cục bộ: liên quan chủ đề là chính, ngày updated dùng để phá hòa. Không gọi API hoặc model."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Các item metadata do papers trả về"
          items:
            type: object
            properties:
              arxiv_id: {type: string}
              title: {type: string}
              summary: {type: string}
              updated: {type: string}
              categories: {type: array, items: {type: string}}
              url: {type: string}
              pdf_url: {type: string}
        query: {type: string, description: "Chủ đề dùng để chấm độ liên quan"}
        limit: {type: integer, default: 3, description: "Số paper shortlist; 1-10"}
      required: [items, query]

  - name: citation_audit
    description: "Kiểm tra citation PDF cục bộ trước khi format: arXiv URL/ID, số trang, excerpt và đối chiếu excerpt với text cache của paper_text. Không gọi API."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Paper cùng evidence cần audit"
          items:
            type: object
            properties:
              arxiv_id: {type: string}
              url: {type: string}
              pdf_url: {type: string}
              evidence:
                type: array
                items:
                  type: object
                  properties:
                    page_number: {type: integer}
                    excerpt: {type: string}
                    pdf_url: {type: string}
      required: [items]
